<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Sutrabooru</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="/purify.js"></script>
</head>
<body id="body">
    <h1><a href="/">Sutrabooru</a></h1>

    <h2 id="board_name"></h2>
    <div id="board_desc"></div>
    <hr>

    <div style="display: flex;">
        <div id="preview" style="width: 50%;"></div>

        <div id="post" style="width: 50%;">
            <input type="text" name="title" id="thread_title" style="width: 100%;" placeholder="Title">

            <input type="text" name="name" id="post_name" style="width: 100%;" placeholder="Your Name">

            <textarea name="body" id="post_body" rows="5" style="vertical-align: top; resize: vertical; width: 100%;" placeholder="Message"></textarea>

            <span id="err" style="color: #FF2222;"></span>
            <button id="post_button">Post a thread</button>
        </div>
    </div>
    <hr>

    <ul id="threads">
    </ul>

</body>
</html>

<template id="thread_template">
    <li>
        <b><a href="/" class="name">lorem-ipsum</a></b> -
        <span class="created muted">long before time had a name</span>
        <br>
        "<span class="latest_msg muted">something?</span>" - <span class="last_activity muted">somewhen</span>
    </li>
</template>

<script type="module">

    import { timeAgo, postMsg, postThread, setCookie, getCookie, renderMarkdown} from '/module.js';

    async function post_handler() {
        let error = document.getElementById("err");

        let name = document.getElementById("post_name");
        if (name.value == "") {
            error.textContent = "Name must not be empty";
            return;
        }

        let body = document.getElementById("post_body");
        if (body.value == "") {
            error.textContent = "Message must not be empty";
            return;
        }

        let title = document.getElementById("thread_title");
        if (title.value == "") {
            error.textContent = "Title must not be empty";
            return;
        }

        let thread_result = await postThread(board_data["name"], title.value)

        if (!thread_result.ok) {
            error.textContent = thread_result.data.err || "Failed to post";
            return;
        }

        let post_result = await postMsg(Number(thread_result.data["id"]), name.value, body.value);

        if (!post_result.ok) {
            error.textContent = post_result.data.err || "Failed to post";
            return;
        }

        setCookie("name", name.value, 365);

        window.location.pathname = "/t/" + thread_result.data["id"];

    }

    function add_entry(id, title, created) {
        let tem = document.getElementById("thread_template");
        let list = document.getElementById("threads");

        let msg = ""
        let msg_created = created

        let clone = tem.content.cloneNode(true);
        let entry = clone.querySelector("li");
        list.appendChild(clone);

        fetch("/api/ms/" + id + "/-1~1").then( (response) => response.json().then( (json) => {
            
            let latest = json[0];
            if (latest) {
                msg = latest["body"]
                msg_created = latest["created"]
            }

            entry.querySelector('.name').textContent = title;
            entry.querySelector('.name').href = "/t/" + id;
            entry.querySelector('.created').textContent = timeAgo(created*1000);
            entry.querySelector(".latest_msg").textContent = msg;
            entry.querySelector(".last_activity").textContent = timeAgo(msg_created*1000)
        }
        ))
    }

    document.getElementById("post_button").addEventListener("click", post_handler);

    // `/b/...` (normally)
    let board = window.location.pathname.slice(3);

    let response = await fetch("/api/b/"+board);
    let board_data = await response.json();

    console.log(board_data)

    document.getElementById("board_name").textContent = "b/" + board_data["name"] + "/";
    document.getElementById("board_desc").textContent = board_data["description"];

    let post_body = document.getElementById("post_body")
    post_body.addEventListener('input',() => renderMarkdown(document.getElementById('preview'), post_body.value))

    response = await fetch('/api/ts/' + board);

    if (!response.ok) {
        console.log("failed to load threads:", response.body);
    }

    let data = await response.json();
    console.log(data);

    // make sure the elements are ordered
    for (let item of data) {
        add_entry(item["id"], item["title"],item["created"]);
    }

    if (getCookie("name")) {
        document.getElementById("post_name").value = getCookie("name")
    }
</script>
