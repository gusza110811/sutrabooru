<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sutrabooru</title>

    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="/purify.js"></script>
</head>
<body id="body">
    <h1><a href="/">Sutrabooru</a></h1>

    <h2> <a id="board_name" class="muted"></a> <span id="thread_title"></span></h2>

    <hr>

    <div id="messages"></div>

    <hr>

    <div id="post" style="justify-self: right; text-align: right;">
        <span><b>Name</b> <input type="text" name="name" id="post_name" style="width: 20ch;"> </span>
        <br>
        <span style="display: inline-block; vertical-align: text-top;">
            <b>Message</b>
            <textarea name="body" id="post_body" rows="5" style="vertical-align: top; resize: vertical; width: 20ch;"></textarea>
        </span>
        <br>
        <span id="err" style="color: #FF2222;"></span>
        <button id="post_button">Join the conversation</button>
    </div>

</body>
</html>

<template id="message_template">
    <article style="display: flex; padding: 3px 2px; margin: 5px 2px; align-items: center; background-color: #beffbe;" class="container">
        <b class="author" style="width: 15ch; max-width: 15%; margin-left: auto; text-align: right;">lorem-ipsum</b>
        <div class="body_text" style="padding: 2px 8px; min-width: calc(100% - 30ch); width: 65%; box-sizing: border-box;"></div>
        <span class="created muted" style="width: 15ch; max-width: 20%; ">some time ago</span>
    </article>
</template>

<script type="module">

    import {timeAgo, setCookie, getCookie, postMsg, sendNotification} from '/module.js';

    const config = {
        ADD_TAGS: ['button'],       // Ensure the tag itself is allowed
        ADD_ATTR: ['onclick'],      // Allow the user-initiated interaction attribute
    };

    function add_entry(id, author, body, created) {
        let tem = document.getElementById("message_template");
        let list = document.getElementById("messages");

        let clone = tem.content.cloneNode(true);

        clone.querySelector('.author').textContent = author;
        clone.querySelector('.created').dataset.time = created;
        clone.querySelector('.created').textContent = timeAgo(created*1000);

        const body_formatted = DOMPurify.sanitize(marked.parse(body),config);
        clone.querySelector('.body_text').innerHTML = body_formatted;

        clone.querySelector('.container').id = id.toString();

        for (let item of clone.querySelectorAll("button")) {
            console.log(item, item.getAttribute('onclick'))
            item.title = item.getAttribute('onclick');
        }

        list.appendChild(clone);
    }

    function update_timestamps() {
        let list = document.getElementById("messages").querySelectorAll(".created");
        for (let item of list) {
            item.textContent = timeAgo(item.dataset.time*1000)
        }
    }

    async function post_handler() {
        let error = document.getElementById("err");

        let name = document.getElementById("post_name");
        if (name.value == "") {
            error.textContent = "Name must not be empty";
            return;
        }

        let body = document.getElementById("post_body");
        if (body.value == "") {
            error.textContent = "Message must not be empty";
            return;
        }

        let result = await postMsg(Number(thread), name.value, body.value);

        if (!result.ok) {
            error.textContent = result.data.err || "Failed to post";
            return;
        }

        body.value = "";
        body.focus();
        body.select();

        setCookie("name", name.value, 365);

        await load_messages();

        window.location.hash = last_msg_id.toString();

    }

    async function load_messages(do_notif=false) {
        if (messages_loading) {
            return
        }

        messages_loading = true
        response = await fetch('/api/ms/' + thread + "?" + "after=" + last_msg_id);

        if (!response.ok) {
            console.log("failed to load messages:", response.body);
        }
        let data = await response.json();

        for (let item of data) {
            add_entry(item["id"], item["author"], item["body"], item["created"]);
            last_msg_id = item["id"]
            if (do_notif) {
                sendNotification(item["author"] + " replied to a thread you're on", item["body"], item["id"])
            }
        }
        messages_loading = false
    }

    let messages_loading = false

    let last_msg_id = 0;

    let post_button = document.getElementById("post_button");
    post_button.addEventListener("click", post_handler);

    document.getElementById("post_body").addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();

            post_handler();
        }
    });

    // `/t/...` (normally)
    let thread = window.location.pathname.slice(3);

    let response = await fetch('/api/t/' + thread);
    if (!response.ok) {
        document.getElementById("thread_title").textContent = "Thread not found";
        document.getElementById("post").hidden = true;
    }
    let thread_data = await response.json();

    let board = thread_data["board"]

    response = await fetch("/api/b/"+board);
    let board_data = await response.json();

    let loading = load_messages();

    const load_interval = setInterval(() => load_messages(true) & update_timestamps(), 1000)

    document.getElementById("board_name").href = "/b/" + board + "/";
    document.getElementById("board_name").textContent = "b/" + board + "/";
    document.getElementById("thread_title").textContent = thread_data["title"];

    if (getCookie("name")) {
        document.getElementById("post_name").value = getCookie("name")
    }

    await loading;

</script>
